<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>ShortRef</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(79, 112, 255, 0.10), transparent 34rem),
        radial-gradient(circle at 80% 80%, rgba(39, 174, 96, 0.08), transparent 30rem),
        #f5f7fb;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 56px);
      border: 1px solid rgba(23, 32, 51, 0.10);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 70px rgba(23, 32, 51, 0.10);
      backdrop-filter: blur(14px);
    }
    .mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      font: 700 14px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .mark::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4f70ff;
      box-shadow: 0 0 0 6px rgba(79, 112, 255, 0.12);
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    p {
      margin: 22px 0 0;
      color: #566176;
      font-size: 17px;
      line-height: 1.8;
    }
    .en {
      margin-top: 12px;
      font-size: 14px;
      color: #7a8498;
    }
    footer {
      margin-top: 38px;
      padding-top: 22px;
      border-top: 1px solid rgba(23, 32, 51, 0.09);
      color: #8a93a5;
      font-size: 13px;
    }
    @media (prefers-color-scheme: dark) {
      :root { color: #eef2ff; background: #0c1120; }
      body {
        background:
          radial-gradient(circle at 20% 20%, rgba(99, 126, 255, 0.16), transparent 34rem),
          radial-gradient(circle at 80% 80%, rgba(54, 211, 153, 0.10), transparent 30rem),
          #0c1120;
      }
      main {
        border-color: rgba(255, 255, 255, 0.10);
        background: rgba(18, 25, 43, 0.84);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }
      p { color: #b2bbcc; }
      .en, footer { color: #8f99ad; }
      footer { border-color: rgba(255, 255, 255, 0.09); }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">ShortRef</div>
    <h1>稳定引用服务</h1>
    <p>此服务仅用于解析已经创建的引用链接。创建、修改和管理操作不会在公开页面中提供。</p>
    <p class="en" lang="en">A minimal service for resolving pre-created, stable reference links.</p>
    <footer>ShortRef · Read-only public resolver</footer>
  </main>
</body>
</html>
