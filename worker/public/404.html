<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>引用不存在 · ShortRef</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(79, 112, 255, 0.10), transparent 34rem),
        #f5f7fb;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 56px);
      border: 1px solid rgba(23, 32, 51, 0.10);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 70px rgba(23, 32, 51, 0.10);
      backdrop-filter: blur(14px);
    }
    .code {
      margin-bottom: 24px;
      color: #4f70ff;
      font: 700 clamp(42px, 10vw, 72px)/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: -0.05em;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }
    p {
      margin: 20px 0 0;
      color: #566176;
      font-size: 17px;
      line-height: 1.8;
    }
    .en {
      margin-top: 10px;
      font-size: 14px;
      color: #7a8498;
    }
    a {
      display: inline-flex;
      margin-top: 32px;
      padding: 11px 16px;
      border: 1px solid rgba(79, 112, 255, 0.25);
      border-radius: 12px;
      color: #3959d8;
      background: rgba(79, 112, 255, 0.08);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }
    a:hover { background: rgba(79, 112, 255, 0.14); }
    @media (prefers-color-scheme: dark) {
      :root { color: #eef2ff; background: #0c1120; }
      body {
        background:
          radial-gradient(circle at 20% 20%, rgba(99, 126, 255, 0.16), transparent 34rem),
          #0c1120;
      }
      main {
        border-color: rgba(255, 255, 255, 0.10);
        background: rgba(18, 25, 43, 0.84);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }
      p { color: #b2bbcc; }
      .en { color: #8f99ad; }
      a { color: #aebcff; border-color: rgba(126, 148, 255, 0.30); }
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>引用不存在或已停用</h1>
    <p>请检查链接是否完整，或联系向你提供此链接的人。</p>
    <p class="en" lang="en">This reference does not exist or is no longer active.</p>
    <a href="/">返回服务首页</a>
  </main>
</body>
</html>
